version: "3.9"

services:
  cache:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    depends_on:
      cache:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - ./redisinsight/data:/data
    networks:
      - redis-cluster-net
    environment:
      - REDISINSIGHT_HOST=0.0.0.0

  mongodb:
    image: mongo:latest
    hostname: mongodb
    volumes:
      - mongodb-data:/data/db/
      - mongodb-log:/var/log/mongodb/
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: myapp
    ports:
      - "27017:27017"
    networks:
      - mongodb_network

  mongo-express:
    image: mongo-express:latest
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: 'mongodb'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - 8081:8081
    networks:
      - mongodb_network
    depends_on:
      - mongodb

networks:
  redis-cluster-net:
    driver: bridge
  mongodb_network:
    driver: bridge
    name: mongo-network

volumes:
  mongodb-data:
    driver: local
    name: mongo-data
  mongodb-log:
    driver: local
    name: mongo-log